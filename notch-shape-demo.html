<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Dynamic Island Shape — v5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .label { color: white; font-size: 13px; opacity: 0.7; margin-bottom: 6px; text-align: center; }
  .island-clip {
    clip-path: url(#islandV5);
    background: rgba(0,0,0,0.90);
    backdrop-filter: blur(40px);
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    color: white; font-size: 14px; font-weight: 500;
  }
  .left { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #34c759; box-shadow: 0 0 8px #34c759; }
  .right { font-size: 20px; opacity: 0.5; }
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="islandV5" clipPathUnits="objectBoundingBox">
    <!--
      380×60 基准，objectBoundingBox (0-1)

      标准 90° 圆角（基于直角切线，无突出）:
      对于凸圆角 (x,y) → 圆心在 (x-r, y-r)
      用三次贝塞尔近似: k = 0.5523

      右下角: 圆心 (380-18, 60-18) = (362, 42)
        起点 (362, 60)  ← 垂直边底部
        CP1 (362+18*0.552, 60) = (372, 60)
        CP2 (380, 60-18*0.552) = (380, 50)
        终点 (380, 42)  ← 水平边右端

      但我们的形状侧边不在 x=380，而是在 x=370（凹弧后）
      所以底部圆角需要从侧边 x=370 过渡到底边 x=380
      这就是"突出"的来源——底边比侧边宽

      解决方案：底部圆角不延伸到 x=380，而是在侧边 x=370 处开始
      即底部宽度 = 侧边宽度，圆角只做 90° 内角

      重新设计:
      侧边 x=370，底部 y=60
      右下角标准 90° 圆角 r=16:
        圆心: (370, 60)  ← 角的顶点
        但这是内角，圆角应该在外侧

      正确做法：底部与侧边同宽
      右下角: (370, 60-16) → (370+16, 60)
      即从 (370, 44) 到 (386, 60)
      CP1: (370, 44+16*0.552) = (370, 52.8)
      CP2: (386-16*0.552, 60) = (377.2, 60)

      但 386 > 380 (顶边宽度)，所以底边会超出顶边
      这就产生了"突出"

      最终方案：底边不超过顶边
      右下角: (370, 44) → (380, 60)
      这不是标准 90° 圆角，但可以避免突出

      或者：让侧边在底部回到 x=380
      即侧边从顶部 x=370 凹入，到底部回到 x=380
      这样圆角就是标准 90°

      最简洁方案：侧边垂直，底部圆角标准
      侧边 x=358 (即顶边宽 - 2*11 = 380-22)
      圆角 r=16
      右下角: (358, 44) → (374, 60)
      CP1: (358, 52.8), CP2: (366, 60)

      或者更简单：不缩窄侧边，让整个形状就是一个带顶部凹弧过渡的胶囊
      侧边 = 顶边，只是顶部角落有凹弧过渡
    -->

    <!-- 最终方案：侧边与顶边同宽，顶部通过凹弧从顶边平滑过渡 -->
    <path d="
      M 0 0
      L 1 0
      C 1 0, 0.97 0, 0.97 0.18
      L 0.97 0.733
      A 0.047 0.267 0 0 1 0.97 0.733
      C 0.97 0.733, 1 0.733, 1 1
      L 0 1
      C 0 1, 0.03 1, 0.03 0.733
      L 0.03 0.18
      C 0.03 0, 0 0, 0 0
      Z
    "/>
  </clipPath>
</defs>
</svg>

<!-- 测试 1 -->
<div>
  <div class="label">测试 1: 标准 SVG 圆角弧</div>
  <div class="island-clip" style="width:380px;height:60px">
    <div class="left"><div class="dot"></div><span>Comate</span></div>
    <div class="right">＋</div>
  </div>
</div>

<!-- 直接用标准 90° 圆角的方案 -->
<svg style="position:absolute;width:0;height:0" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="islandV5b" clipPathUnits="objectBoundingBox">
    <!--
      最终方案 v5b:
      - 顶边平直 (0,0)→(1,0)
      - 顶角柔和凹弧过渡
      - 侧边垂直（与底部同宽）
      - 底部标准 90° 凸圆角 r=16px

      380×60 基准:
      侧边 x=370 (缩进10px)
      底部圆角 r=16
      右下角: 圆心 (370, 60)，从 (370, 44) 到 (386, 60)
      但 386 > 380 → 突出

      解决: 底边宽度 = 370+16 = 386，但顶边也是 380
      所以底部会比顶部宽 6px → 这就是突出

      根本问题: 凹弧让侧边比顶边窄，但底部圆角需要侧边到顶边的空间

      最终方案: 底部不缩窄，保持与侧边同宽
      侧边 x = 370
      底边 y = 60
      右下角: 标准 90° r=16
      圆心: (370+16, 60-16) = (386, 44) — 不对

      正确的 90° 圆角：
      从垂直线段底部到水平线段右端
      垂直线: x=370, 从 y=10 到 y=44 (60-16)
      水平线: y=60, 从 x=370+16=386 到 x=... 但 386>380

      所以底部圆角 r 最大只能是 10 (380-370)
      如果 r=10:
      右下角: (370, 50) → (380, 60)
      CP1: (370, 50+10*0.552)=(370, 55.5)
      CP2: (380-10*0.552, 60)=(374.5, 60)

      左下角: (10, 50) → (0, 60)  — 不对，应该对称

      重新计算:
      顶边宽 380
      侧边 x = 370 (右边), x = 10 (左边)
      可用圆角空间 = 380-370 = 10 (右边), 370-380 = -10... 

      好吧，侧边不应该缩进到比底部圆角空间更窄
      侧边 x 应该 >= 顶边宽 - r
      如果 r=16, 侧边 x >= 380-16 = 364

      设侧边 x=366 (留 14px 给顶部凹弧)
      右下角: (366, 44) → (382, 60) — 382>380 突出

      设侧边 x=364
      右下角: (364, 44) → (380, 60) — 刚好！
      CP1: (364, 44+16*0.552)=(364, 52.8)
      CP2: (380-16*0.552, 60)=(371.2, 60)

      好！侧边 x=364, 底部 r=16, 无突出
    -->
    <path d="
      M 0 0
      L 1 0
      C 1 0, 0.958 0, 0.958 0.167
      L 0.958 0.733
      C 0.958 0.88, 1 0.88, 1 1
      L 0 1
      C 0 1, 0.042 1, 0.042 0.88
      L 0.042 0.167
      C 0.042 0, 0 0, 0 0
      Z
    "/>
  </clipPath>
</defs>
</svg>

<div>
  <div class="label">v5b: 侧边 x=364, 底部 r=16, 无突出</div>
  <div class="island-clip" style="width:380px;height:60px; clip-path: url(#islandV5b)">
    <div class="left"><div class="dot"></div><span>Comate</span></div>
    <div class="right">＋</div>
  </div>
</div>

<!-- 最终方案：底部圆角不突出，但稍微小一点的 r=14 -->
<svg style="position:absolute;width:0;height:0" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="islandV5c" clipPathUnits="objectBoundingBox">
    <!--
      v5c: 更柔和的方案
      侧边 x=366, 底部 r=14
      右下角: (366, 46) → (380, 60)
      CP1: (366, 46+14*0.552)=(366, 53.7)
      CP2: (380-14*0.552, 60)=(372.3, 60)
      无突出！
    -->
    <path d="
      M 0 0
      L 1 0
      C 1 0, 0.963 0, 0.963 0.167
      L 0.963 0.767
      C 0.963 0.895, 1 0.895, 1 1
      L 0 1
      C 0 1, 0.037 1, 0.037 0.895
      L 0.037 0.167
      C 0.037 0, 0 0, 0 0
      Z
    "/>
  </clipPath>
</defs>
</svg>

<div>
  <div class="label">v5c: 侧边 x=366, 底部 r=14, 无突出</div>
  <div class="island-clip" style="width:380px;height:60px; clip-path: url(#islandV5c)">
    <div class="left"><div class="dot"></div><span>Comate</span></div>
    <div class="right">＋</div>
  </div>
</div>

<!-- 轮廓可视化 v5c -->
<div>
  <div class="label">v5c 路径轮廓 (380×60)</div>
  <svg width="380" height="60" viewBox="0 0 380 60" xmlns="http://www.w3.org/2000/svg" style="background:rgba(255,255,255,0.08);border-radius:8px">
    <path d="
      M 0 0
      L 380 0
      C 380 0, 366 0, 366 10
      L 366 46
      C 366 53.7, 380 53.7, 380 60
      L 0 60
      C 0 60, 14 60, 14 53.7
      L 14 10
      C 14 0, 0 0, 0 0
      Z
    " fill="rgba(0,0,0,0.6)"/>
    <path d="
      M 0 0
      L 380 0
      C 380 0, 366 0, 366 10
      L 366 46
      C 366 53.7, 380 53.7, 380 60
      L 0 60
      C 0 60, 14 60, 14 53.7
      L 14 10
      C 14 0, 0 0, 0 0
      Z
    " fill="none" stroke="#ff3b30" stroke-width="1.5"/>
    <!-- 圆角切线标注 -->
    <line x1="366" y1="46" x2="366" y2="60" stroke="#ffcc00" stroke-width="0.5" stroke-dasharray="2"/>
    <line x1="366" y1="60" x2="380" y2="60" stroke="#ffcc00" stroke-width="0.5" stroke-dasharray="2"/>
    <circle cx="366" cy="46" r="2" fill="#ffcc00"/>
    <circle cx="380" cy="60" r="2" fill="#34c759"/>
  </svg>
</div>

</body>
</html>
