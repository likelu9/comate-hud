<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Dynamic Island Shape — v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 50px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .label {
    color: white; font-size: 13px; opacity: 0.7;
    margin-bottom: 8px; text-align: center;
  }
  .island-clip {
    height: 60px;
    clip-path: url(#islandV2);
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(40px);
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    color: white; font-size: 14px; font-weight: 500;
  }
  .left { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #34c759; box-shadow: 0 0 8px #34c759; }
  .right { font-size: 20px; opacity: 0.5; }
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="islandV2" clipPathUnits="objectBoundingBox">
    <path d="
      M 0 0
      L 1 0
      C 0.95 0.04, 0.90 0.20, 0.90 0.35
      C 0.90 0.65, 0.947 0.65, 0.947 1
      L 0.053 1
      C 0.053 0.65, 0.10 0.65, 0.10 0.35
      C 0.10 0.20, 0.05 0.04, 0 0
      Z
    "/>
  </clipPath>
</defs>
</svg>

<!-- 效果 1: 380×60 基础 -->
<div>
  <div class="label">基础 380×60 — 凹弧侧边 + 底部凸圆角 r=20</div>
  <div class="island-clip" style="width:380px">
    <div class="left"><div class="dot"></div><span>Comate</span></div>
    <div class="right">＋</div>
  </div>
</div>

<!-- 效果 2: 460×56 -->
<div>
  <div class="label">宽屏 460×56</div>
  <div class="island-clip" style="width:460px; height:56px">
    <div class="left"><div class="dot"></div><span>Comate</span></div>
    <div class="right">＋</div>
  </div>
</div>

<!-- 路径轮廓可视化 -->
<div>
  <div class="label">路径轮廓可视化（380×60 原始坐标）</div>
  <svg width="380" height="60" viewBox="0 0 380 60" xmlns="http://www.w3.org/2000/svg" style="background:rgba(255,255,255,0.08);border-radius:8px">
    <path d="
      M 0 0
      L 380 0
      C 361 2.4, 342 12, 342 21
      C 342 39, 360 39, 360 60
      L 20 60
      C 20 39, 38 39, 38 21
      C 38 12, 19 2.4, 0 0
      Z
    " fill="rgba(0,0,0,0.6)"/>
    <path d="
      M 0 0
      L 380 0
      C 361 2.4, 342 12, 342 21
      C 342 39, 360 39, 360 60
      L 20 60
      C 20 39, 38 39, 38 21
      C 38 12, 19 2.4, 0 0
      Z
    " fill="none" stroke="#ff3b30" stroke-width="1.5"/>
    <circle cx="342" cy="21" r="3" fill="#ffcc00"/>
    <circle cx="360" cy="60" r="3" fill="#34c759"/>
    <circle cx="38" cy="21" r="3" fill="#ffcc00"/>
    <circle cx="20" cy="60" r="3" fill="#34c759"/>
  </svg>
</div>

</body>
</html>
