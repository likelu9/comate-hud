<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Dynamic Island — v8 (最终)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .label { color: white; font-size: 13px; opacity: 0.7; margin-bottom: 6px; text-align: center; }
  .island-clip {
    clip-path: url(#islandV8);
    background: rgba(0,0,0,0.90);
    backdrop-filter: blur(40px);
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    color: white; font-size: 14px; font-weight: 500;
  }
  .left { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #34c759; box-shadow: 0 0 8px #34c759; }
  .right { font-size: 20px; opacity: 0.5; }
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="islandV8" clipPathUnits="objectBoundingBox">
    <!--
      380×60 基准，objectBoundingBox (0-1)

      真实 Dynamic Island 轮廓:
      - 顶边平直
      - 顶角凹弧：平滑 S 曲线，从顶边水平切线过渡到侧边垂直切线
      - 侧边垂直
      - 底角标准 90° 凸圆角 r=14
      - 底边平直

      关键坐标 (380×60 px):
      顶边: (0,0) → (380,0)

      右顶角凹弧 (三次贝塞尔):
        起点: (380, 0)
        CP1: (380, 12)   — 沿顶边垂直方向（保持水平切线）
        CP2: (350, 10)   — 向内收，控制凹入深度
        终点: (350, 22)  — 侧边起点（垂直切线）

      右侧: (350, 22) → (350, 46)

      右底角圆角 (三次贝塞尔近似标准 90° r=14):
        起点: (350, 46)
        CP1: (350, 53.8) — 垂直切线 (46+14*0.552≈53.7)
        CP2: (372.2, 60) — 水平切线 (380-14*0.552≈372.3)
        终点: (372, 60)  — 不，应该到 (380, 60)...

      等等，底边应该与顶边同宽吗？
      参考图：底部圆角后底边与顶边同宽
      所以右底角应该从 (350, 46) 到 (380, 60)
      但这不是标准 90° 圆角，因为 380-350=30 > 14(r)

      参考图分析：底部圆角很大，几乎占满侧边到底边的空间
      r 应该 = 380-350 = 30? 不，底角没那么大

      重新分析参考图:
      - 顶部比 body 宽约 20-25%
      - 底部圆角 r 约 12-16px
      - 底边宽度 = body 宽度（不是顶边宽度）

      所以底部不会突出，因为底边宽度 = body 宽度
      右下角: (350, 46) → (364, 60)
      这才是标准圆角，r=14

      但参考图底部看起来比较宽...
      看参考图底部：圆角很大，底边几乎与 body 同宽
      也许 r=16 更合适

      最终:
      侧边 x=350, 底角 r=16
      右下角: (350, 44) → (366, 60)
      CP1: (350, 44+16*0.552)=(350, 52.8)
      CP2: (380-16*0.552, 60)=(371.2, 60) — 不对，终点应该是 (366, 60)

      标准 90° 圆角 r=16:
      起点: (350, 44) = (side_x, h - r)
      终点: (366, 60) = (side_x + r, h)
      CP1: (350, 44 + 16*0.552) = (350, 52.8)
      CP2: (366 - 16*0.552, 60) = (357.2, 60)

      好，这样底边宽度 = 2*366 - 380 = 352? 不对
      底边从左下角终点到右下角终点
      左下角终点: (380-366, 60) = (14, 60)
      右下角终点: (366, 60)
      底边宽度: 366-14 = 352

      换算 0-1:
      350/380=0.921, 22/60=0.367, 44/60=0.733
      366/380=0.963, 52.8/60=0.88, 357.2/380=0.94
    -->
    <path d="
      M 0 0
      L 1 0
      C 1 0.2, 0.921 0.167, 0.921 0.367
      L 0.921 0.733
      C 0.921 0.88, 0.94 0.88, 0.963 1
      L 0.037 1
      C 0.06 0.88, 0.079 0.88, 0.079 0.733
      L 0.079 0.367
      C 0.079 0.167, 0 0.2, 0 0
      Z
    "/>
  </clipPath>
</defs>
</svg>

<div>
  <div class="label">380×60 — 顶角 S 曲线凹弧 + 垂直侧边 + 底部凸圆角 r=16</div>
  <div class="island-clip" style="width:380px;height:60px">
    <div class="left"><div class="dot"></div><span>Comate</span></div>
    <div class="right">＋</div>
  </div>
</div>

<!-- 轮廓可视化 -->
<div>
  <div class="label">路径轮廓 (380×60)</div>
  <svg width="380" height="60" viewBox="0 0 380 60" xmlns="http://www.w3.org/2000/svg" style="background:rgba(255,255,255,0.08);border-radius:8px">
    <path d="
      M 0 0
      L 380 0
      C 380 12, 350 10, 350 22
      L 350 44
      C 350 52.8, 357.2 52.8, 366 60
      L 14 60
      C 22.8 52.8, 30 52.8, 30 44
      L 30 22
      C 30 10, 0 12, 0 0
      Z
    " fill="rgba(0,0,0,0.6)"/>
    <path d="
      M 0 0
      L 380 0
      C 380 12, 350 10, 350 22
      L 350 44
      C 350 52.8, 357.2 52.8, 366 60
      L 14 60
      C 22.8 52.8, 30 52.8, 30 44
      L 30 22
      C 30 10, 0 12, 0 0
      Z
    " fill="none" stroke="#ff3b30" stroke-width="1.5"/>
    <!-- 控制点连线 -->
    <line x1="380" y1="0" x2="380" y2="12" stroke="#ffcc00" stroke-width="0.5" stroke-dasharray="2"/>
    <line x1="380" y1="12" x2="350" y2="10" stroke="#ffcc00" stroke-width="0.5" stroke-dasharray="2"/>
    <line x1="350" y1="22" x2="350" y2="44" stroke="#ffcc00" stroke-width="0.5" stroke-dasharray="2"/>
    <circle cx="350" cy="22" r="2.5" fill="#ffcc00"/>
    <circle cx="350" cy="44" r="2.5" fill="#ffcc00"/>
    <circle cx="30" cy="22" r="2.5" fill="#ffcc00"/>
    <circle cx="30" cy="44" r="2.5" fill="#ffcc00"/>
  </svg>
</div>

</body>
</html>
